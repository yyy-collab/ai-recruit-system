$kind: http-example
request:
  url: "{{baseUrl}}/hr/login"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "username": "string",
        "password": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 1894,
        "msg": "string",
        "data": {
          "token": "string",
          "expires_in": 551,
          "is_info_complete": true
        }
      }
order: 1000
