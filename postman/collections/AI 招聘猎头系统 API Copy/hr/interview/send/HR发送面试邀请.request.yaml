$kind: http-request
url: "{{baseUrl}}/hr/interview/send"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "delivery_id": 2192,
      "interview_date": "1995-11-03",
      "interview_time": "18:58",
      "interview_type": "线上面试",
      "interview_round": "终试",
      "interview_address": "string",
      "contact_name": "string",
      "contact_phone": "17497765288",
      "remark": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/HR发送面试邀请.resources/examples
order: 1000
