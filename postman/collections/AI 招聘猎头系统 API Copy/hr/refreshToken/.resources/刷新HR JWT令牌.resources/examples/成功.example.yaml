$kind: http-example
request:
  url: "{{baseUrl}}/hr/refreshToken"
  method: POST
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 9255,
        "msg": "string",
        "data": {
          "token": "string",
          "expires_in": 7402
        }
      }
order: 1000
