$kind: http-request
url: "{{baseUrl}}/common/file/upload"
method: POST
headers:
  Content-Type: multipart/form-data
  Accept: application/json
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
    - type: text
      key: type
      value: avatar
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/公共文件上传（头像等）.resources/examples
order: 1000
