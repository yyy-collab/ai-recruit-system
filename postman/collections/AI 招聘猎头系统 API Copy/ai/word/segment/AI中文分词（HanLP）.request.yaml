$kind: http-request
url: "{{baseUrl}}/ai/word/segment"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "text": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/AI中文分词（HanLP）.resources/examples
order: 1000
