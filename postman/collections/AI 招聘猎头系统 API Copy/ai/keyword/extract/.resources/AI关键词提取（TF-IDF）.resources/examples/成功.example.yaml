$kind: http-example
request:
  url: "{{baseUrl}}/ai/keyword/extract"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "type": "text",
        "content": "string",
        "resume_id": 4581,
        "job_id": 2126,
        "limit": 10
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 8031,
        "msg": "string",
        "data": {}
      }
order: 1000
