$kind: http-example
request:
  url: "{{baseUrl}}/seeker/updatePwd"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "old_pwd": "string",
        "new_pwd": "2uf0RTHzNQgAs",
        "re_pwd": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 7933,
        "msg": "string",
        "data": {}
      }
order: 1000
