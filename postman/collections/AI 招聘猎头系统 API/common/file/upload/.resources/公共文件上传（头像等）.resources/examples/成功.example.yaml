$kind: http-example
request:
  url: "{{baseUrl}}/common/file/upload"
  method: POST
  headers:
    - key: Content-Type
      value: multipart/form-data
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: formdata
    content:
      - type: file
        key: file
        src: []
      - type: text
        key: type
        value: avatar
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 7933,
        "msg": "string",
        "data": {}
      }
order: 1000
