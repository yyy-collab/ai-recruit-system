$kind: http-example
request:
  url: "{{baseUrl}}/hr/resetPwd"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "username": "string",
        "email": "NvyDQ3L6RHe@e.ito",
        "code": "string",
        "new_pwd": "string",
        "re_pwd": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 7933,
        "msg": "string",
        "data": {}
      }
order: 1000
