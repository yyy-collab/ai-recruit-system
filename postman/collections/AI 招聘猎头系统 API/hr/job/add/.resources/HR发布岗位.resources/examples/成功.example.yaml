$kind: http-example
request:
  url: "{{baseUrl}}/hr/job/add"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "job_name": "string",
        "job_desc": "string",
        "requirement": "string",
        "keywords": "string",
        "salary": "15-25K",
        "work_address": "string",
        "work_experience": "3-5年"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": 7933,
        "msg": "string",
        "data": {}
      }
order: 1000
