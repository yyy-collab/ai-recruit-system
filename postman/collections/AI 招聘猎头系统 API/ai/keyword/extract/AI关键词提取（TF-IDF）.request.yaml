$kind: http-request
url: "{{baseUrl}}/ai/keyword/extract"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "type": "resume",
      "content": "string",
      "resume_id": 5107,
      "job_id": 509,
      "limit": 10
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
examples: ./.resources/AI关键词提取（TF-IDF）.resources/examples
order: 1000
